name: Sync Project to GitLab Portfolio

on:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  sync-and-build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout Android Project
        uses: actions/checkout@v4

      - name: Setup Node.js 16 (node-sass native match)
        uses: actions/setup-node@v4
        with:
          node-version: 16

      - name: Clone GitLab Portfolio Repo
        env:
          GL_TOKEN: ${{ secrets.GITLAB_PORTFOLIO_TOKEN }}
        run: |
          git config --global user.name "Antigravity Sync Bot"
          git config --global user.email "bot@antigravity.ai"
          git clone https://oauth2:${GL_TOKEN}@gitlab.com/NormanJaimes/norman-jaimes.git gitlab-portfolio

      - name: Inject Project Data & Copy Assets to Source
        run: |
          node scripts/sync-portfolio.mjs portfolio.json gitlab-portfolio/src/js/data/portFolioData.js

          # Inyectar en src/assets/portafolio/ (Fuente de verdad que Webpack copia a public/)
          TARGET_DIR="gitlab-portfolio/src/assets/portafolio"
          mkdir -p "$TARGET_DIR"

          for img in "VideAPP.jpg" "docs/VideAPP.jpg" "assets/VideAPP.jpg"; do
            if [ -f "$img" ]; then
              cp "$img" "$TARGET_DIR/VideAPP.jpg"
              echo "Imagen copiada con éxito a $TARGET_DIR/VideAPP.jpg desde $img"
              break
            fi
          done

      - name: Install Dependencies & Build Webpack
        run: |
          cd gitlab-portfolio
          npm install --legacy-peer-deps
          npm run build

      - name: Push All Changes (src + public) to GitLab
        run: |
          cd gitlab-portfolio
          git add src/ public/
          if git diff --staged --quiet; then
            echo "Sin cambios tras la compilación."
          else
            git commit -m "feat(portfolio): auto-sync VideAPP assets and rebuild bundle"
            git push origin master
          fi
