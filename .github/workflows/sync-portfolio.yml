name: Sync Project to GitLab Portfolio

on:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  sync-and-build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout Android Project
        uses: actions/checkout@v4

      # Node 16: OpenSSL 1.1 nativo y binario precompilado de node-sass
      - name: Setup Node.js 16 (node-sass native match)
        uses: actions/setup-node@v4
        with:
          node-version: 16

      - name: Clone GitLab Portfolio Repo
        env:
          GL_TOKEN: ${{ secrets.GITLAB_PORTFOLIO_TOKEN }}
        run: |
          git config --global user.name "Antigravity Sync Bot"
          git config --global user.email "bot@antigravity.ai"
          git clone https://oauth2:${GL_TOKEN}@gitlab.com/NormanJaimes/norman-jaimes.git gitlab-portfolio

      - name: Inject Project Data & Assets
        run: |
          node scripts/sync-portfolio.mjs portfolio.json gitlab-portfolio/src/js/data/portFolioData.js

          TARGET_DIR="gitlab-portfolio/public/assets/portafolio"
          mkdir -p "$TARGET_DIR"
          if [ -f "VideAPP.jpg" ]; then cp VideAPP.jpg "$TARGET_DIR/"; fi
          if [ -f "docs/VideAPP.jpg" ]; then cp docs/VideAPP.jpg "$TARGET_DIR/"; fi

      - name: Install Dependencies & Build Webpack
        run: |
          cd gitlab-portfolio
          npm install --legacy-peer-deps
          npm run build

      - name: Push All Changes (src + public) to GitLab
        run: |
          cd gitlab-portfolio
          git add src/ public/
          if git diff --staged --quiet; then
            echo "Sin cambios tras la compilación."
          else
            git commit -m "feat(portfolio): auto-sync VideAPP data and rebuild public bundle"
            git push origin master
          fi
