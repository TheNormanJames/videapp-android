name: Sync Project to GitLab Portfolio

on:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  sync-and-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Android Project
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Clone GitLab Portfolio Repo
        env:
          GL_TOKEN: ${{ secrets.GITLAB_PORTFOLIO_TOKEN }}
        run: |
          git config --global user.name "Antigravity Sync Bot"
          git config --global user.email "bot@antigravity.ai"
          git clone https://oauth2:${GL_TOKEN}@gitlab.com/NormanJaimes/norman-jaimes.git gitlab-portfolio

      - name: Inject Project Data & Copy Cover Image
        run: |
          # 1. Inyectar datos en src/js/data/portFolioData.js
          node scripts/sync-portfolio.mjs portfolio.json gitlab-portfolio/src/js/data/portFolioData.js
          
          # 2. Copiar imagen a la carpeta de assets del portafolio si existe en el repo
          TARGET_IMG_DIR="gitlab-portfolio/public/assets/portafolio"
          mkdir -p "$TARGET_IMG_DIR"
          
          if [ -f "docs/VideAPP.jpg" ]; then
            cp docs/VideAPP.jpg "$TARGET_IMG_DIR/"
          elif [ -f "assets/VideAPP.jpg" ]; then
            cp assets/VideAPP.jpg "$TARGET_IMG_DIR/"
          elif [ -f "VideAPP.jpg" ]; then
            cp VideAPP.jpg "$TARGET_IMG_DIR/"
          fi

      - name: Install Dependencies & Build Webpack
        run: |
          cd gitlab-portfolio
          npm install --legacy-peer-deps
          npm run build

      - name: Push Changes (src + public) to GitLab
        run: |
          cd gitlab-portfolio
          git add src/ public/
          if git diff --staged --quiet; then
            echo "Sin cambios detectados tras la compilación."
          else
            git commit -m "feat(portfolio): auto-sync VideAPP data and build production bundle"
            git push origin master
          fi
