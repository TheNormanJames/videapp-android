name: Build and Publish APK Release

on:
  push:
    tags:
      - 'v*' # Se activa al hacer push de etiquetas como v1.0.0, v1.0.1, etc.
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    permissions:
      contents: write # Necesario para que el runner pueda crear el Release
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
          cache: gradle

      - name: Grant Execute Permission for Gradlew
        run: chmod +x gradlew

      - name: Build Android APK
        run: ./gradlew assembleRelease || ./gradlew assembleDebug

      - name: Locate and Rename APK
        run: |
          mkdir -p release-artifacts
          APK_PATH=$(find app/build/outputs/apk/ -name "*.apk" | head -n 1)
          cp "$APK_PATH" "release-artifacts/VideAPP-${{ github.ref_name }}.apk"

      - name: Create GitHub Release with APK
        uses: softprops/action-gh-release@v2
        with:
          name: "VideAPP ${{ github.ref_name }}"
          draft: false
          prerelease: false
          generate_release_notes: true
          files: release-artifacts/*.apk

